spring.application.name=eventmanager

# swagger
springdoc.swagger-ui.url=/event-manager-openapi.yaml

# Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# Jpa
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Security
jwt.secret=${JWT_SECRET:yq2B7mK9pX3vR8tL5nQ1zA6cF4jH2wE0uY9iO3sD5gN8kP7mT}
jwt.secret.lifetime=${JWT_LIFETIME:7200000}

event_status_cron=0 */1 * * * *

# Kafka (producer)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.LongSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
app.kafka.topic.domain-events=${KAFKA_TOPIC:event-domain-events}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Cache (Redis-backed)
spring.cache.type=redis
spring.cache.redis.time-to-live=600000